name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # Never cancel a main or tag run part-way, or a release could be tagged without its GitHub release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # Merging a pull request releases a new version. The PR's label picks the bump:
      # release:major, release:minor, or release:skip for no release; anything else is a
      # patch. A PR that already changed package.json's version to an untagged one is
      # released as it is. The bump is committed straight to main by this workflow.
      - name: Bump version from the merged pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for label in "release:major|b60205|Merging releases the next major version" \
                       "release:minor|fbca04|Merging releases the next minor version" \
                       "release:skip|cfd3d7|Merging does not release a new version"; do
            IFS='|' read -r name color description <<< "$label"
            gh label create "$name" --repo "$REPO" --color "$color" --description "$description" 2> /dev/null || true
          done

          if ! git ls-remote --exit-code --tags origin "refs/tags/v$(node -p "require('./package.json').version")" > /dev/null; then
            echo "package.json already has an unreleased version, so it is released as it is."
            exit 0
          fi

          merged=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0] // empty')
          pr=$(jq -r '.number // empty' <<< "$merged")
          labels=$(jq -r '.labels[]?.name' <<< "$merged")
          if [ -z "$pr" ]; then
            echo "This push did not come from a merged pull request, so no version is bumped."
            exit 0
          fi
          if grep -qx "release:skip" <<< "$labels"; then
            echo "PR #$pr is labeled release:skip."
            exit 0
          elif grep -qx "release:major" <<< "$labels"; then bump=major
          elif grep -qx "release:minor" <<< "$labels"; then bump=minor
          else bump=patch
          fi

          # Bump on top of main as it is now, in case another merge landed since this run started,
          # and from the newest release tag when it is ahead of package.json.
          git fetch origin main
          git checkout -B main origin/main
          files=$(node -p "require('./package.json').version")
          newest=$( (echo "$files"; git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$') | sort -V | tail -1)
          version=$(node scripts/bump-version.mjs "$bump" "$newest")
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version" -m "$bump bump from #$pr (was v$newest)."
          git push origin main
          echo "Bumped to v$version ($bump) for PR #$pr."

      # A push to main releases package.json's version when it has no tag yet, which the
      # step above makes sure of for merged pull requests.
      - name: Pick release version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists, so this push only updates latest."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Shelf
            org.opencontainers.image.description=Self-hosted ebook and audiobook library, reader, and player.

      # Pull requests only check that the image builds; pushes to main and v* tags publish it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tags created with GITHUB_TOKEN don't start another run, so the image above is the only build.
      - name: Tag the release
        id: tag
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # HEAD is the version bump commit when the step above made one.
          git tag "$TAG" HEAD
          if ! git push origin "refs/tags/$TAG"; then
            # Someone pushed the same tag by hand a moment ago; that push publishes it.
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG was just pushed by someone else, so there is nothing to release."
              exit 0
            fi
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
